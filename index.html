<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>EBP Daily Brief</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">ICHIMIZU-KAI</p>
      <h1>EBP Daily Brief</h1>
      <p class="lead">犯罪予防、EBP/EBPM、AI・データ活用、警察の防犯施策等の重要情報を、原典への導線とともに整理します。</p>
    </div>
  </header>

  <main class="container">
    <section class="panel latest-panel">
      <div class="section-heading">
        <div>
          <p class="kicker">LATEST</p>
          <h2>最新のDaily Brief</h2>
        </div>
        <a id="latestPdf" class="button secondary hidden" href="#" target="_blank" rel="noopener">PDF版を開く</a>
      </div>
      <div id="latestBrief" aria-live="polite"></div>
    </section>

    <section class="panel">
      <p class="kicker">SEARCH</p>
      <h2>記事を探す</h2>
      <div class="search-grid">
        <label>
          <span>キーワード</span>
          <input id="searchInput" type="search" placeholder="例：自転車盗、CPTED、効果検証">
        </label>
        <label>
          <span>地域</span>
          <select id="regionFilter">
            <option value="">すべて</option>
            <option value="domestic">国内</option>
            <option value="international">海外</option>
          </select>
        </label>
        <label>
          <span>情報種別</span>
          <select id="sourceTypeFilter">
            <option value="">すべて</option>
            <option value="government">公的機関</option>
            <option value="research">研究・論文</option>
            <option value="police">警察実務</option>
            <option value="other">その他</option>
          </select>
        </label>
      </div>
      <div id="tagFilters" class="tag-filters"></div>
      <p id="searchCount" class="muted"></p>
      <div id="searchResults"></div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <p class="kicker">ARCHIVE</p>
          <h2>過去のDaily Brief</h2>
        </div>
        <a class="text-link" href="https://drive.google.com/drive/folders/17L-6pARPBwcP827R2pij6D_AI55DQM3R" target="_blank" rel="noopener">PDF保管フォルダ</a>
      </div>
      <div id="archive"></div>
    </section>

    <section class="panel compact">
      <p class="kicker">POLICY</p>
      <h2>制作方針</h2>
      <p>一次情報・査読研究・公的機関資料を優先し、掲載件数より情報の質を重視します。記事では「確認された事実」「どう読むか」「エビデンス」「限界」「実務への示唆」を分けて表示します。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>EBP Daily Brief / いちみず会</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
